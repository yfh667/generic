<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Satellite Network • Interactive Center Longitude</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background-color: #f3f3f3;
    }
    #map { position: absolute; inset: 0; }

    .ui-panel {
      position: absolute;
      background: rgba(255,255,255,0.9);
      border-radius: 10px;
      padding: 10px 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
      font-size: 12px;
      line-height: 1.2;
    }
    .control-panel {
      left: 12px;
      top: 12px;
      width: 260px;
    }
    .control-panel label { font-weight: 600; color: #333; }
    .control-panel input[type="range"] { width: 100%; margin-top: 8px; }
    .control-row {
      display: flex; gap: 6px; margin-top: 8px; align-items: center;
    }
    .control-row input[type="text"]{
      flex: 1; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px;
    }
    .control-row button{
      padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="control-panel ui-panel">
    <label for="center-lon">Center Longitude: <span id="lon-value">0° E</span></label>
    <input id="center-lon" type="range" min="-180" max="180" value="0" step="1" />
    <div class="control-row">
      <input id="center-lon-input" type="text" placeholder="如 110E / 75W / -120" />
      <button id="center-lon-apply">应用</button>
    </div>
  </div>

  <script>
  (async function() {
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          carto: {
            type: 'raster',
            tiles: ['https://basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png'],
            tileSize: 256,
            attribution: '© OpenStreetMap contributors, © CARTO'
          }
        },
        layers: [
          { id: 'bg', type: 'background', paint: { 'background-color': '#f3f3f3' } },
          { id: 'carto', type: 'raster', source: 'carto' }
        ]
      },
      center: [0, 0],
      zoom: 1.5,
      renderWorldCopies: true
    });

    // 读取数据
    const snapshotResp = await fetch('./snapshot_100.json');
    const snapshotData = await snapshotResp.json();
    const originalSatellites = snapshotData.satellites;
    const originalLinks = snapshotData.links;

    // 可选的高亮分组
    let highlightedGroups = [];
    try {
      const highlightResp = await fetch('./highlighted.json');
      if (highlightResp.ok) highlightedGroups = await highlightResp.json();
    } catch (_) { /* 没有高亮文件也没关系 */ }

    // 构建 id -> color
    const highlightedMap = new Map();
    highlightedGroups.forEach(group => {
      (group.satellites || []).forEach(satId => {
        // 统一用数字键
        highlightedMap.set(Number(satId), group.color || '#ff0000');
      });
    });

    // 工具：经度换窗
    function remapLongitude(lng, center) {
      let newLng = lng;
      while (newLng <= center - 180) newLng += 360;
      while (newLng >  center + 180) newLng -= 360;
      return newLng;
    }

    function updateVisualization(centerLng) {
      const coordsById = new Map();

      const pointFeatures = originalSatellites.map((sat) => {
        const remappedLng = remapLongitude(sat.lng, centerLng);
        coordsById.set(String(sat.id), [remappedLng, sat.lat]);

        const satIdAsNumber = Number(sat.id);
        const color = highlightedMap.has(satIdAsNumber) ? highlightedMap.get(satIdAsNumber) : '#808080';

        return {
          type: 'Feature',
          properties: { id: satIdAsNumber, altitude: sat.alt, color },
          geometry: { type: 'Point', coordinates: [remappedLng, sat.lat] }
        };
      });

      const lineFeatures = (originalLinks || [])
        .map((link) => {
          const s = coordsById.get(String(link.source));
          const t = coordsById.get(String(link.target));
          if (!s || !t) return null;
          return { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: [s, t] } };
        })
        .filter(Boolean);

      const pointsFC = { type: 'FeatureCollection', features: pointFeatures };
      const linesFC  = { type: 'FeatureCollection', features: lineFeatures  };

      map.getSource('sat_points').setData(pointsFC);
      map.getSource('sat_links').setData(linesFC);

      map.easeTo({ center: [centerLng, map.getCenter().lat], duration: 0 });
    }

    // 规范化与解析输入
    function normalizeLongitude(lng) {
      let v = Number(lng);
      if (!Number.isFinite(v)) return null;
      v = ((((v + 180) % 360) + 360) % 360) - 180; // 折算到 [-180,180)
      if (v === -180) v = 180;
      return v;
    }
    function parseLongitudeInput(str) {
      if (!str) return null;
      const s = String(str).trim().toUpperCase();
      const m = s.match(/^([+-]?\d+(?:\.\d+)?)(?:\s*([EW]))?$/);
      if (!m) return null;
      let val = parseFloat(m[1]);
      const hemi = m[2];
      if (hemi === 'W') val = -Math.abs(val);
      if (hemi === 'E') val =  Math.abs(val);
      return normalizeLongitude(val);
    }
    function fmtLonText(lng) {
      const dir = lng < 0 ? 'W' : 'E';
      const abs = Math.abs(lng);
      return `${abs.toFixed(0)}° ${dir}`;
    }

    map.on('load', () => {
      const emptyFC = { type: 'FeatureCollection', features: [] };
      map.addSource('sat_links',  { type: 'geojson', data: emptyFC });
      map.addSource('sat_points', { type: 'geojson', data: emptyFC });

      map.addLayer({
        id: 'sat-links',
        type: 'line',
        source: 'sat_links',
        paint: { 'line-color': '#666', 'line-width': 1.0, 'line-opacity': 0.4 }
      });
// // 视觉绕行线：初始空，默认隐藏
// map.addSource('sat_links_rerouted', { type: 'geojson', data: { type:'FeatureCollection', features: [] } });
// map.addLayer({
//   id: 'sat-links-rerouted',
//   type: 'line',
//   source: 'sat_links_rerouted',
//   layout: { visibility: 'none' },
//   paint: {
//     'line-color': '#1976d2',
//     'line-width': 1.2,
//     'line-opacity': 0.9,
//     'line-dasharray': [2, 2]   // 虚线，表示视觉改道
//   }
// });

      map.addLayer({
        id: 'sat-circles',
        type: 'circle',
        source: 'sat_points',
        paint: {
          'circle-radius': 4.2,
          'circle-color': 'rgba(0,0,0,0)',
          'circle-stroke-color': ['get', 'color'],
          'circle-stroke-width': 1.6,
          'circle-stroke-opacity': 1.0
        }
      });


      // Hover 弹窗
      const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false });
      map.on('mousemove', 'sat-circles', (e) => {
        const f = e.features && e.features[0];
        if (!f) return;
        map.getCanvas().style.cursor = 'pointer';
        const { id, altitude } = f.properties;
        popup.setLngLat(e.lngLat)
             .setHTML(`<div style="font-size:12px"><b>${id}</b><br/>Alt: ${altitude} km</div>`)
             .addTo(map);
      });
      map.on('mouseleave', 'sat-circles', () => { map.getCanvas().style.cursor = ''; popup.remove(); });

      // 控件联动
      const slider       = document.getElementById('center-lon');
      const valueDisplay = document.getElementById('lon-value');
      const inputBox     = document.getElementById('center-lon-input');
      const applyBtn     = document.getElementById('center-lon-apply');

      function applyCenterFromInput() {
        const parsed = parseLongitudeInput(inputBox.value);
        if (parsed === null) {
          inputBox.style.borderColor = '#f00';
          setTimeout(() => (inputBox.style.borderColor = '#ccc'), 800);
          return;
        }
        const v = Math.round(parsed); // 与滑杆步长保持一致
        slider.value = String(v);
        valueDisplay.textContent = fmtLonText(v);
        updateVisualization(v);
      }

      slider.addEventListener('input', (e) => {
        const v = parseInt(e.target.value, 10);
        valueDisplay.textContent = fmtLonText(v);
        inputBox.value = v >= 0 ? `${v}E` : `${Math.abs(v)}W`;
        updateVisualization(v);
      });
      applyBtn.addEventListener('click', applyCenterFromInput);
      inputBox.addEventListener('keydown', (e) => { if (e.key === 'Enter') applyCenterFromInput(); });

      // 初始化
      inputBox.value = '0E';
      valueDisplay.textContent = fmtLonText(0);
      updateVisualization(0);
    });
  })();
  </script>
</body>
</html>
