<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>路由参数选择</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding-top: 50px; /* 顶部留白 */
            background-color: #f4f4f4;
        }

        .container {
            background-color: #fff;
            padding: 30px 50px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .parameter-section {
            display: flex;
            flex-direction: column;
            margin-bottom: 30px;
        }

        .parameter-label {
            font-size: 1.2em;
            font-weight: bold;
            color: #555;
            margin-bottom: 15px;
        }

        .option-box {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .option-box:hover {
            background-color: #e9e9e9;
            border-color: #aaa;
        }

        input[type="radio"] {
            margin-right: 15px;
            transform: scale(1.2); /* 放大单选框 */
        }

        .option-text {
            font-size: 1.1em;
            color: #333;
        }

        .calculate-button {
            width: 100%;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1.2em;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 20px;
        }

        .calculate-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>路由参数选择</h2>

        <div class="parameter-section">
            <div class="parameter-label">参数</div>

            <label class="option-box">
                <input type="radio" name="route_priority" value="delay" checked>
                <span class="option-text">延迟优先</span>
            </label>

            <label class="option-box">
                <input type="radio" name="route_priority" value="flow">
                <span class="option-text">流量优先</span>
            </label>
        </div>

        <button class="calculate-button" onclick="calculateRoute()">
            路由计算
        </button>
    </div>

    <script>
        function calculateRoute() {
            // 获取被选中的单选按钮的值
            const selectedOption = document.querySelector('input[name="route_priority"]:checked').value;
            let priorityText = "";

            if (selectedOption === "delay") {
                priorityText = "延迟优先";
            } else if (selectedOption === "flow") {
                priorityText = "流量优先";
            }

            // 在实际应用中，您会在这里调用后端API进行路由计算
            alert(`已选择: ${priorityText}。正在进行路由计算...`);

            // 可以在这里添加Ajax请求等后续处理
        }
    </script>

</body>
</html>
