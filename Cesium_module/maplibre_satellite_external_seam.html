<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Satellite Network • Interactive Center Longitude</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background-color: #f3f3f3;
    }
    #map {
      position: absolute;
      inset: 0;
    }
    /*#map canvas.maplibregl-canvas {*/
    /*  filter: saturate(0%) brightness(100%) contrast(95%);*/
    /*}*/
    .ui-panel {
      position: absolute;
      background: rgba(255,255,255,0.9);
      border-radius: 10px;
      padding: 10px 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
      font-size: 12px;
      line-height: 1.2;
    }
    .control-panel {
      left: 12px;
      top: 78px;
      width: 200px;
    }
    .control-panel label {
      font-weight: 600;
      color: #333;
    }
    .control-panel input[type="range"] {
      width: 100%;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div id="map"></div>
  <div class="control-panel ui-panel">
      <label for="center-lon">Center Longitude: <span id="lon-value">0</span>° E</label>
      <input id="center-lon" type="range" min="-180" max="180" value="0" step="1">
  </div>

  <script>
  (async function() {
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          carto: {
            type: 'raster',
            tiles: ['https://basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png'],
            tileSize: 256,
            attribution: '© OpenStreetMap contributors, © CARTO'
          }
        },
        layers: [
          { id: 'bg', type: 'background', paint: { 'background-color': '#f3f3f3' } },
          { id: 'carto', type: 'raster', source: 'carto' }
        ]
      },
      center: [0, 0],
      zoom: 1.5,
      renderWorldCopies: true
    });

    // Fetch external data files
    const snapshotResponse = await fetch('./snapshot_100.json');
    const snapshotData = await snapshotResponse.json();
    const originalSatellites = snapshotData.satellites;
    const originalLinks = snapshotData.links;

    const highlightResponse = await fetch('./highlighted.json');
    const highlightedGroups = await highlightResponse.json();

    // Map group names to their color and satellite IDs
    const highlightedMap = new Map();
    highlightedGroups.forEach(group => {
      group.satellites.forEach(satId => {
        highlightedMap.set(satId, group.color);
      });
    });

    function remapLongitude(lng, center) {
        let newLng = lng;
        while (newLng <= center - 180) {
            newLng += 360;
        }
        while (newLng > center + 180) {
            newLng -= 360;
        }
        return newLng;
    }

    function updateVisualization(centerLng) {
      const coordsById = new Map();
      const pointFeatures = originalSatellites.map((sat) => {
        const remappedLng = remapLongitude(sat.lng, centerLng);
        coordsById.set(String(sat.id), [remappedLng, sat.lat]);

        // Get color from highlightedMap or use default color
            const satIdAsNumber = Number(sat.id);

              const color = highlightedMap.has(satIdAsNumber) ? highlightedMap.get(satIdAsNumber) : '#808080'; // 默认橙色



        return {
          type: 'Feature',
          properties: {
            id: sat.id,
            altitude: sat.alt,
            color: color  // Set color based on highlighted data
          },
          geometry: {
            type: 'Point',
            coordinates: [remappedLng, sat.lat]
          }
        };
      });

      const lineFeatures = originalLinks
        .map((link) => {
          const sourceCoord = coordsById.get(String(link.source));
          const targetCoord = coordsById.get(String(link.target));
          if (!sourceCoord || !targetCoord) return null;

          return {
            type: 'Feature',
            properties: {},
            geometry: {
              type: 'LineString',
              coordinates: [sourceCoord, targetCoord]
            }
          };
        })
        .filter(Boolean); // Remove any nulls if a satellite ID was not found

      const pointsFC = { type: 'FeatureCollection', features: pointFeatures };
      const linesFC = { type: 'FeatureCollection', features: lineFeatures };

      map.getSource('sat_points').setData(pointsFC);
      map.getSource('sat_links').setData(linesFC);

      map.easeTo({
        center: [centerLng, map.getCenter().lat],
        duration: 0
      });
    }

    map.on('load', () => {
      const emptyFC = { type: 'FeatureCollection', features: [] };
      map.addSource('sat_links', { type: 'geojson', data: emptyFC });
      map.addSource('sat_points', { type: 'geojson', data: emptyFC });

      map.addLayer({
        id: 'sat-links',
        type: 'line',
        source: 'sat_links',
        paint: {
          'line-color': '#666',
          'line-width': 1.0,
          'line-opacity': 0.4
        }
      });

      map.addLayer({
        id: 'sat-circles',
        type: 'circle',
        source: 'sat_points',
        paint: {
          'circle-radius': 4.2,
          'circle-color': 'rgba(0,0,0,0)',       // Transparent fill
          'circle-stroke-color': ['get', 'color'], // Use the color from the properties
          'circle-stroke-width': 1.6,            // Fine border
          'circle-stroke-opacity': 1.0
        }
      });

      // Setup popup for displaying satellite info on hover
      const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false });
      map.on('mousemove', 'sat-circles', (e) => {
        const f = e.features && e.features[0];
        if (!f) return;
        const { id, altitude } = f.properties;
        const [x, y] = e.lngLat.toArray();
        popup.setLngLat([x, y])
          .setHTML(`<div style="font-size:12px"><b>${id}</b><br/>Alt: ${altitude} km</div>`)
          .addTo(map);
      });
      map.on('mouseleave', 'sat-circles', () => popup.remove());

      const slider = document.getElementById('center-lon');
      const valueDisplay = document.getElementById('lon-value');

      slider.addEventListener('input', (e) => {
        const centerLng = parseInt(e.target.value, 10);
        valueDisplay.textContent = `${Math.abs(centerLng)}° ${centerLng < 0 ? 'W' : 'E'}`;
        updateVisualization(centerLng);
      });

      updateVisualization(0);
    });
  })();
  </script>
</body>
</html>
