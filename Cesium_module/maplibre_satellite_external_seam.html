<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Satellite Network • Interactive Center Longitude</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background-color: #f3f3f3;
    }
    #map { position: absolute; inset: 0; }
    .ui-panel {
      position: absolute;
      background: rgba(255,255,255,0.9);
      border-radius: 10px;
      padding: 10px 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
      font-size: 12px;
      line-height: 1.2;
      backdrop-filter: blur(2px);
    }
    .control-panel { left: 12px; top: 12px; width: 280px; }
    .control-panel label { font-weight: 600; color: #333; }
    .control-panel input[type="range"] { width: 100%; margin-top: 8px; }
    .control-row { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
    .control-row input[type="text"]{
      flex: 1; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px;
    }
    .control-row button{
      padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer;
    }
    .control-row select{
      padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; background: #fff;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="control-panel ui-panel">
    <label for="center-lon">Center Longitude: <span id="lon-value">0° E</span></label>
    <input id="center-lon" type="range" min="-180" max="180" value="0" step="1" />
    <div class="control-row">
      <input id="center-lon-input" type="text" placeholder="如 110E / 75W / -120" />
      <button id="center-lon-apply">应用</button>
    </div>
    <div class="control-row">
      <button id="btn-export">导出 PNG</button>
      <select id="export-scale" title="导出倍率">
        <option value="1">1×</option>
        <option value="2" selected>2×</option>
        <option value="3">3×</option>
        <option value="4">4×</option>
      </select>
      <label style="display:flex; align-items:center; gap:6px;">
        <input id="transparent-bg" type="checkbox"> 透明底
      </label>
    </div>
  </div>

  <script>
  (async function() {
    const SATELLITES_PER_ORBIT = 36; // 每轨卫星数（用于判断邻/跨轨道）

    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          carto: {
            type: 'raster',
            tiles: ['https://basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png'],
            tileSize: 256,
            attribution: '© OpenStreetMap contributors, © CARTO'
          }
        },
        layers: [
          { id: 'bg', type: 'background', paint: { 'background-color': '#f3f3f3' } },
          { id: 'carto', type: 'raster', source: 'carto' }
        ]
      },
      center: [0, 0],
      zoom: 1.5,
      renderWorldCopies: true,
      antialias: true,
      preserveDrawingBuffer: true
    });

    // 读取数据
    const snapshotResp = await fetch('./snapshot_100.json');

    // 读取 Path.json：可支持 "15-36-53" 字符串或 [15,36,53] 数组
let pathNodes = [];
try {
  const pr = await fetch('./Path.json');
  if (pr.ok) {
    const pj = await pr.json();
    if (Array.isArray(pj)) {
      pathNodes = pj.map(n => Number(n)).filter(Number.isFinite);
    } else if (typeof pj === 'string') {
      pathNodes = pj.split(/[-,\s,]+/).map(n => Number(n)).filter(Number.isFinite);
    }
  }
} catch (e) { /* 没有 Path.json 也没关系 */ }

    const snapshotData = await snapshotResp.json();
    const originalSatellites = snapshotData.satellites || [];
    // 兼容旧字段：没有 links_active 时，用 links 作为 active
    const originalLinksActive  = snapshotData.links_active  || snapshotData.links || [];
    const originalLinksPending = snapshotData.links_pending || [];

    // 可选高亮
    let highlightedGroups = [];
    try {
      const highlightResp = await fetch('./highlighted.json');
      if (highlightResp.ok) highlightedGroups = await highlightResp.json();
    } catch (_) {}
    const highlightedMap = new Map();
    highlightedGroups.forEach(group => {
      (group.satellites || []).forEach(sid => {
        highlightedMap.set(Number(sid), group.color || '#ff0000');
      });
    });

    // —— 导出缓存 ——
    let lastPointsFC = { type: 'FeatureCollection', features: [] };
    let lastLinesActiveFC  = { type: 'FeatureCollection', features: [] };
    let lastLinesPendingFC = { type: 'FeatureCollection', features: [] };

    // 经度换窗
    function remapLongitude(lng, center) {
      let newLng = lng;
      while (newLng <= center - 180) newLng += 360;
      while (newLng >  center + 180) newLng -= 360;
      return newLng;
    }

    // 纠正跨 180° 经线的断裂
function connectAcrossDateline(s, t) {
  const target = [...t];
  const d = s[0] - t[0];
  if (d > 180) target[0] += 360;
  else if (d < -180) target[0] -= 360;
  return target;
}

// 从节点序列生成折线段集合，并交替设置 +/− 偏移（像素）
function buildPathFeaturesFromNodes(pathNodes, coordsById) {
  if (!Array.isArray(pathNodes) || pathNodes.length < 2) return [];
  const feats = [];
  for (let i = 0; i < pathNodes.length - 1; i++) {
    const a = String(pathNodes[i]);
    const b = String(pathNodes[i+1]);
    const s = coordsById.get(a);
    const t = coordsById.get(b);
    if (!s || !t) continue;

    const target = connectAcrossDateline(s, t);
    const offsetPx = (i % 2 === 0) ? 4 : -4;    // 交替向两侧偏移 3px

    feats.push({
      type: 'Feature',
      properties: { offset: offsetPx },
      geometry: { type: 'LineString', coordinates: [s, target] }
    });
  }
  return feats;
}


    // 生成线要素：给每条线打上 isNormal（邻/同轨道）属性
    function buildLineFeatures(rawLinks, coordsById) {
      return (rawLinks || [])
        .map(link => {
          const sCoord = coordsById.get(String(link.source));
          const tCoord = coordsById.get(String(link.target));
          if (!sCoord || !tCoord) return null;

          // 视觉跨经度边界修正
          const targetCoords = [...tCoord];
          const lonDiff = sCoord[0] - tCoord[0];
          if (lonDiff > 180) targetCoords[0] += 360;
          else if (lonDiff < -180) targetCoords[0] -= 360;

          // 邻/跨轨道判断
          const sId = Number(link.source);
          const tId = Number(link.target);
          const sOrbit = Math.floor(sId / SATELLITES_PER_ORBIT);
          const tOrbit = Math.floor(tId / SATELLITES_PER_ORBIT);
          const isNormal = Math.abs(sOrbit - tOrbit) <= 1; // 邻/同轨道为 true

          return {
            type: 'Feature',
            properties: { isNormal }, // 颜色用它
            geometry: { type: 'LineString', coordinates: [sCoord, targetCoords] }
          };
        })
        .filter(Boolean);
    }

    function updateVisualization(centerLng) {
      const coordsById = new Map();

      const pointFeatures = originalSatellites.map((sat) => {
        const remappedLng = remapLongitude(sat.lng, centerLng);
        coordsById.set(String(sat.id), [remappedLng, sat.lat]);

        const sid = Number(sat.id);
        const color = highlightedMap.has(sid) ? highlightedMap.get(sid) : '#808080';

        return {
          type: 'Feature',
          properties: { id: sid, altitude: sat.alt, color },
          geometry: { type: 'Point', coordinates: [remappedLng, sat.lat] }
        };
      });

      const lineFeaturesActive  = buildLineFeatures(originalLinksActive,  coordsById);
      const lineFeaturesPending = buildLineFeatures(originalLinksPending, coordsById);

      const pointsFC = { type: 'FeatureCollection', features: pointFeatures };
      const linesActiveFC  = { type: 'FeatureCollection', features: lineFeaturesActive  };
      const linesPendingFC = { type: 'FeatureCollection', features: lineFeaturesPending };

      // 缓存给导出
      lastPointsFC = pointsFC;
      lastLinesActiveFC  = linesActiveFC;
      lastLinesPendingFC = linesPendingFC;

      map.getSource('sat_points').setData(pointsFC);


      // —— 路径也要随 centerLng 重算 ——
// 这里的 coordsById 是你 updateVisualization 中构建的那个 Map
const pathFeats = buildPathFeaturesFromNodes(pathNodes, coordsById);
map.getSource('path_overlay').setData({
  type: 'FeatureCollection',
  features: pathFeats
});


      map.getSource('sat_links_active').setData(linesActiveFC);
      map.getSource('sat_links_pending').setData(linesPendingFC);

      map.easeTo({ center: [centerLng, map.getCenter().lat], duration: 0 });
    }

    // 输入规范化
    function normalizeLongitude(lng) {
      let v = Number(lng);
      if (!Number.isFinite(v)) return null;
      v = ((((v + 180) % 360) + 360) % 360) - 180;
      if (v === -180) v = 180;
      return v;
    }
    function parseLongitudeInput(str) {
      if (!str) return null;
      const s = String(str).trim().toUpperCase();
      const m = s.match(/^([+-]?\d+(?:\.\d+)?)(?:\s*([EW]))?$/);
      if (!m) return null;
      let val = parseFloat(m[1]);
      const hemi = m[2];
      if (hemi === 'W') val = -Math.abs(val);
      if (hemi === 'E') val =  Math.abs(val);
      return normalizeLongitude(val);
    }
    function fmtLonText(lng) {
      const dir = lng < 0 ? 'W' : 'E';
      const abs = Math.abs(lng);
      return `${abs.toFixed(0)}° ${dir}`;
    }

    map.on('load', () => {
      const emptyFC = { type: 'FeatureCollection', features: [] };
      map.addSource('sat_points',        { type: 'geojson', data: emptyFC });
      map.addSource('sat_links_active',  { type: 'geojson', data: emptyFC });
      map.addSource('sat_links_pending', { type: 'geojson', data: emptyFC });

      // 颜色规则（两层共用）：isNormal=true -> 黑色；false -> 蓝色
      const colorExpr = [
        'case',
        ['get', 'isNormal'], '#000000', // 邻/同轨道：黑
        '#0077ff'                        // 跨轨道：蓝
      ];

      // 工作链路：实线
      map.addLayer({
        id: 'sat-links-active',
        type: 'line',
        source: 'sat_links_active',
        paint: {
          'line-color': colorExpr,
          'line-width': 1.1,
          'line-opacity': 0.85
        }
      });

      // 正在建链：虚线
      map.addLayer({
        id: 'sat-links-pending',
        type: 'line',
        source: 'sat_links_pending',
        paint: {
          'line-color': colorExpr,
          'line-width': 1.1,
          'line-opacity': 0.95,
          'line-dasharray': [2, 2]
        }
      });

      // 卫星点
      map.addLayer({
        id: 'sat-circles',
        type: 'circle',
        source: 'sat_points',
        paint: {
          'circle-radius': 4.2,
          'circle-color': 'rgba(0,0,0,0)',
          'circle-stroke-color': ['get', 'color'],
          'circle-stroke-width': 1.6,
          'circle-stroke-opacity': 1.0
        }
      });

 // 路径源
map.addSource('path_overlay', { type: 'geojson', data: { type:'FeatureCollection', features: [] } });

// 路径层：红色，使用 line-offset 侧移避免重叠
map.addLayer({
  id: 'path-overlay',
  type: 'line',
  source: 'path_overlay',
  paint: {
    'line-color': '#e53935',   // 红色
    'line-width': 2.0,
    'line-opacity': 0.95,
    'line-offset': ['get', 'offset'] // 从要素属性读取偏移像素
  }
});

      // Hover
      const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false });
      map.on('mousemove', 'sat-circles', (e) => {
        const f = e.features && e.features[0];
        if (!f) return;
        map.getCanvas().style.cursor = 'pointer';
        const { id, altitude } = f.properties;
        popup.setLngLat(e.lngLat)
             .setHTML(`<div style="font-size:12px"><b>${id}</b><br/>Alt: ${altitude} km</div>`)
             .addTo(map);
      });
      map.on('mouseleave', 'sat-circles', () => { map.getCanvas().style.cursor = ''; popup.remove(); });

      // 控件联动
      const slider       = document.getElementById('center-lon');
      const valueDisplay = document.getElementById('lon-value');
      const inputBox     = document.getElementById('center-lon-input');
      const applyBtn     = document.getElementById('center-lon-apply');

      function applyCenterFromInput() {
        const parsed = parseLongitudeInput(inputBox.value);
        if (parsed === null) {
          inputBox.style.borderColor = '#f00';
          setTimeout(() => (inputBox.style.borderColor = '#ccc'), 800);
          return;
        }
        const v = Math.round(parsed);
        slider.value = String(v);
        valueDisplay.textContent = fmtLonText(v);
        updateVisualization(v);
      }

      slider.addEventListener('input', (e) => {
        const v = parseInt(e.target.value, 10);
        valueDisplay.textContent = fmtLonText(v);
        inputBox.value = v >= 0 ? `${v}E` : `${Math.abs(v)}W`;
        updateVisualization(v);
      });
      applyBtn.addEventListener('click', applyCenterFromInput);
      inputBox.addEventListener('keydown', (e) => { if (e.key === 'Enter') applyCenterFromInput(); });

      // 初始化
      inputBox.value = '0E';
      valueDisplay.textContent = fmtLonText(0);
      updateVisualization(0);
    });

    /* ===================== 导出功能 ===================== */

    function downloadDataURL(dataURL, filename='map.png'){
      const a = document.createElement('a');
      a.href = dataURL;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function exportCurrentPNG({ transparent = false, filename = 'satellite_network.png' } = {}){
      let restored = false;
      if (transparent && map.getLayer('bg')) {
        map.setLayoutProperty('bg', 'visibility', 'none');
        restored = true;
      }
      const dataURL = map.getCanvas().toDataURL('image/png');
      downloadDataURL(dataURL, filename);
      if (restored) map.setLayoutProperty('bg', 'visibility', 'visible');
    }

    async function exportHiResPNG(scale = 2, { transparent = false, filename = 'satellite_network_2x.png' } = {}){
      const rect = map.getContainer().getBoundingClientRect();
      const tmp = document.createElement('div');
      tmp.style.position = 'fixed';
      tmp.style.left = '-99999px';
      tmp.style.top = '0';
      tmp.style.width  = `${Math.round(rect.width  * scale)}px`;
      tmp.style.height = `${Math.round(rect.height * scale)}px`;
      document.body.appendChild(tmp);

      const styleClone = JSON.parse(JSON.stringify(map.getStyle()));
      if (transparent) {
        const bgIdx = (styleClone.layers || []).findIndex(l => l.id === 'bg' && l.type === 'background');
        if (bgIdx >= 0) {
          styleClone.layers[bgIdx].layout = styleClone.layers[bgIdx].layout || {};
          styleClone.layers[bgIdx].layout.visibility = 'none';
        }
      }

      const map2 = new maplibregl.Map({
        container: tmp,
        style: styleClone,
        center: map.getCenter(),
        zoom: map.getZoom(),
        bearing: map.getBearing(),
        pitch: map.getPitch(),
        renderWorldCopies: map.options.renderWorldCopies ?? true,
        antialias: true,
        preserveDrawingBuffer: true
      });

      await new Promise(res => map2.once('idle', res));

      try {
        map2.getSource('sat_points')?.setData(lastPointsFC);
        map2.getSource('sat_links_active')?.setData(lastLinesActiveFC);
        map2.getSource('sat_links_pending')?.setData(lastLinesPendingFC);
        await new Promise(res => map2.once('idle', res));
      } catch(e) {}

      const dataURL = map2.getCanvas().toDataURL('image/png');
      downloadDataURL(dataURL, filename);

      map2.remove();
      tmp.remove();
    }

    const btnExport   = document.getElementById('btn-export');
    const selScale    = document.getElementById('export-scale');
    const chkTransBg  = document.getElementById('transparent-bg');

    btnExport.addEventListener('click', async () => {
      const scale = parseInt(selScale.value, 10);
      const transparent = !!chkTransBg.checked;
      if (scale === 1) {
        exportCurrentPNG({ transparent, filename: 'satellite_network.png' });
      } else {
        await exportHiResPNG(scale, { transparent, filename: `satellite_network_${scale}x.png` });
      }
    });

  })();
  </script>
</body>
</html>
