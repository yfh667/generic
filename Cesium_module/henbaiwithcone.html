<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <script src="Cesium/Cesium.js"></script>
    <script src="Cesium/cesium-sensor-volumes.js"></script>
    <link href="Cesium/Widgets/widgets.css" rel="stylesheet">
</head>
<body>
<div id="cesiumContainer" style="width: 100%; height: 100%;"></div>
<script>
    Cesium.Ion.defaultAccessToken ='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIwYzBmNjcwNi01ZTgwLTRmNjktOTZlYi1mNGJlOTBkMTI2NGEiLCJpZCI6MjAzMTkxLCJpYXQiOjE3MTA5MTU2MDB9.3DSkXgP45hF8LHvB5LTd6rujCAEluOegAg9D_NTHmI8';

    var viewer = new Cesium.Viewer('cesiumContainer', {
        skyBox: false,
        skyAtmosphere: false,
        baseLayerPicker: false,
        geocoder: false,
        homeButton: false,
        infoBox: false,
        sceneModePicker: false,
        navigationHelpButton: false,
        shouldAnimate: true,
        contextOptions: {
            webgl: {
                alpha: true
            }
        }
    });

    var scene = viewer.scene;
    scene.backgroundColor = Cesium.Color.WHITE;

    var globe = viewer.scene.globe;
    globe.imageryLayers.removeAll();
    globe.baseColor = Cesium.Color.WHITE;

    var outlineLayer = globe.imageryLayers.addImageryProvider(
        new Cesium.UrlTemplateImageryProvider({
            url: 'https://basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',
            credit: '© CartoDB'
        })
    );

    outlineLayer.alpha = 1.0;
    outlineLayer.brightness = 1;
    const satangle = 45;

    // 加载 CZML 数据源
    // 加载 CZML 数据源
    Cesium.CzmlDataSource.load('Cesium/satellite_trajectory.czml').then(function (czmlData) {
        viewer.dataSources.add(czmlData);

        viewer.clock.shouldAnimate = true; // 开始动画
        viewer.flyTo(czmlData, {
            offset: new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-90), 10000000),
        });

        const entities = czmlData.entities.values; // 获取所有实体

        // 遍历每个卫星实体
        entities.forEach(function (entity) {
            if (entity.position) { // 检查是否有位置属性（即是卫星节点）
                // 使用 headingPitchRollQuaternion 计算锥角的朝向
                let sensorOrientation = new Cesium.CallbackProperty(function (time, result) {
                    const position = entity.position.getValue(time); // 获取卫星当前位置
                    if (position) {
                        // 创建指向地心的 HeadingPitchRoll
                        const hpr = new Cesium.HeadingPitchRoll(
                            Cesium.Math.toRadians(0), // Heading
                            Cesium.Math.toRadians(180), // Pitch（指向地心）
                            0 // Roll
                        );
                        return Cesium.Transforms.headingPitchRollQuaternion(position, hpr);
                    }
                    return result;
                }, false);

                // 为该卫星添加锥角
                viewer.entities.add({
                    position: entity.position, // 绑定卫星位置
                    orientation: sensorOrientation, // 锥角方向
                    conicSensor: new CesiumSensorVolumes.ConicSensorGraphics({
                        radius: 10000000, // 锥角半径
                        innerHalfAngle: Cesium.Math.toRadians(0), // 内锥角
                        outerHalfAngle: Cesium.Math.toRadians(satangle), // 半锥角
                        lateralSurfaceMaterial: Cesium.Color.GOLD.withAlpha(0.15), // 锥角侧面颜色
                        capMaterial: Cesium.Color.RED.withAlpha(0.2), // 锥角顶盖颜色
                    }),
                });
            }
        });
    }).catch(function (error) {
        console.error("Failed to load CZML file:", error);
    });


    viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(19.57, 10.32, 20000000.0),
    });

    viewer.resolutionScale = window.devicePixelRatio;
</script>
</body>
</html>
