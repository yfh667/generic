name: g60_w4h3_full_link_gap_three_pairs_hop_delay

constellation:
  name: G60
  p: 18
  n: 36

inputs:
  topology_library_csv: E:/paper11/data/satnet_experiments/runs/paper1/G60/motif_w4_h3/shortest_delay_t0_86160_stride60/topology_library.csv

metrics:
  - name: ce_delay_ms
    path: E:/paper11/data/satnet_experiments/runs/paper1/G60/motif_w4_h3/shortest_delay_t0_86160_stride60/china_europe/compare_mean_shortest_delay_ms.csv
    reference_topology: full_link
    weight: 0.1666667
    gap: relative_abs
  - name: ce_hops
    path: E:/paper11/data/satnet_experiments/runs/paper1/G60/motif_w4_h3/shortest_hops_t0_86160_stride60/china_europe/compare_w4h3_china_europe_strict_reachable.csv
    reference_topology: full_link
    weight: 0.1666667
    gap: relative_abs
  - name: ca_delay_ms
    path: E:/paper11/data/satnet_experiments/runs/paper1/G60/motif_w4_h3/shortest_delay_t0_86160_stride60/china_africa/compare_mean_shortest_delay_ms.csv
    reference_topology: full_link
    weight: 0.1666667
    gap: relative_abs
  - name: ca_hops
    path: E:/paper11/data/satnet_experiments/runs/paper1/G60/motif_w4_h3/shortest_hops_t0_86160_stride60/china_africa/compare_w4h3_china_africa_strict_reachable.csv
    reference_topology: full_link
    weight: 0.1666667
    gap: relative_abs
  - name: cam_delay_ms
    path: E:/paper11/data/satnet_experiments/runs/paper1/G60/motif_w4_h3/shortest_delay_t0_86160_stride60/china_america/compare_mean_shortest_delay_ms.csv
    reference_topology: full_link
    weight: 0.1666667
    gap: relative_abs
  - name: cam_hops
    path: E:/paper11/data/satnet_experiments/runs/paper1/G60/motif_w4_h3/shortest_hops_t0_86160_stride60/china_america/compare_w4h3_china_america_strict_reachable.csv
    reference_topology: full_link
    weight: 0.1666667
    gap: relative_abs

selector:
  step_column: step
  exclude_topologies: [full_link]
  transition_normalize: max
  switch_penalties: [0, 0.02, 0.05, 0.1, 0.2, 0.5, 1.0, 2.0, 5.0, 10.0]
  # Optional second transition profile:
  # penalise bursts of many newly requested edges in one topology switch.
  # The LST evaluator still uses the real active/building state machine.
  burst_power: 2.0
  burst_threshold: 0
  burst_penalties: [0.2, 0.5, 1.0, 2.0, 5.0, 10.0, 20.0]
  # Hard cap schedules minimise full-link gap while forbidding transitions that
  # would request more than this many new edges in one sampled step.
  transition_caps: [60, 90, 120, 150, 180, 210, 240, 300, 360]
  # Minimum dwell schedules force a topology to stay selected for at least this
  # many sampled rows before another switch. With 60s sampling and 120s LST,
  # dwell=3 lets newly requested links become active before the next switch.
  min_dwell_steps: [3, 5, 10, 20]
  min_dwell_switch_penalties: [0.5, 2.0]
  min_dwell_burst_penalties: [5.0, 7.5, 10.0, 15.0]

outputs:
  out_dir: E:/paper11/data/satnet_experiments/runs/paper1/G60/topology_learning/g60_w4h3_full_link_gap_three_pairs_hop_delay
